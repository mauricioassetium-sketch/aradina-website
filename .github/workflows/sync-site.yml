name: Sync site from preview and deploy to Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch site files from preview
        run: |
          BASE="https://aradina-redesign--mauricioassetium.orijins.app"
          mkdir -p img/partners
          for f in index.html web3.html software.html advisory.html industrias.html proceso.html contacto.html cookies.html privacy.html terms.html favicon.svg; do
            echo "fetching $f"
            curl -fsSL --retry 3 "$BASE/$f" -o "$f"
          done
          echo "fetching img/dubai-skyline.jpg"
          curl -fsSL --retry 3 "$BASE/img/dubai-skyline.jpg" -o img/dubai-skyline.jpg
          for f in apex.svg bimco.png capitalbridge.png dva.png enlightened.svg hextrust.png mercadobitcoin.png nco.png ndc.svg tokeny.png truleum.png upay.png verysset.svg; do
            echo "fetching img/partners/$f"
            curl -fsSL --retry 3 "$BASE/img/partners/$f" -o "img/partners/$f"
          done
          ls -la

      - name: Commit synced site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync redesigned site from preview (redesign completo)" || echo "no changes to commit"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Attach custom domain aradina.net
        run: |
          REPO="${{ github.repository }}"
          code=$(curl -s -o /tmp/pages_resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"cname":"aradina.net","source":"workflow","build_type":"workflow"}')
          echo "POST /pages -> $code"
          cat /tmp/pages_resp.json || true
          if [ "$code" != "201" ]; then
            echo "site exists, updating cname..."
            curl -s -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/pages" \
              -d '{"cname":"aradina.net","source":"workflow","build_type":"workflow"}'
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
